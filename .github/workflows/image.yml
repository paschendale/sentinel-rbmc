# The station monitor's image: tests, then paschendale/sentinel-rbmc:latest and :sha-<commit>.
# Upstream's release workflow does not release from forks; this replaces it here.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentinel
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sentinel/shared build
      - run: pnpm -r typecheck
      - name: Migrations
        working-directory: apps/api
        run: pnpm migrate:ci
      - name: Tests
        working-directory: apps/api
        run: pnpm test

  image:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            paschendale/sentinel-rbmc:latest
            paschendale/sentinel-rbmc:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=rbmc
          cache-to: type=gha,mode=max,scope=rbmc
